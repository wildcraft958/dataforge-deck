<script type="application/json" id="speaker-notes">
[
  "Good afternoon. One sentence, and the rest of the talk earns it. A model can be perfectly capable of solving your problem and still fail it, because of what you put in its memory. This is a deck about a thing called BDH, Pathway's own architecture, and about one variable inside it that decides whether the answer comes out right. The title is What BDH Remembers, and the claim underneath is that capability was never the variable.",
  "Start with something everybody here has done. You give a chatbot two or three worked examples, then you ask your real question. The model does not retrain when you do that. Nobody changes its weights. What happens instead is that your examples are written into a working memory while they are being read, and then the answer is produced by reading that memory back. That is the whole loop. Examples in, memory updated, answer read out. Pathway say it in one line in their own write-up: examples presented at inference time update the model's memory as they are processed. Hold on to that word, memory, because everything after this slide is about the shape of that memory.",
  "Here is what Pathway changed. A normal transformer keeps every example in a list, and that list grows with every token you feed it. Longer prompt, longer list, more to store and more to search. BDH does not keep a list. It keeps one grid of synapse strengths, and it is the same size whether you show it one example or a hundred. Every token adds one small pattern on top of what is already in the grid. In words: each token writes one pattern into the grid, and the grid only ever adds. Written down it is this line: S becomes S plus phi of K, outer product with V. The sources are the Dragon Hatchling paper and chapter two of Pathway's own BDH explainer.",
  "So let us watch that happen instead of talking about it. I am switching to the artifact now, view one. Three things to look for. First, the contribution grid C being built from a single token. Second, C fading onto S, which is the addition I just described. Third, I will click one cell and you will see the number in it, and where the number came from: the value at row i of phi of K, times the value at column j of V. That is the whole write rule, one cell at a time. Everything on that screen is computed in the browser from trained weights while you watch. Nothing is drawn, nothing is a video.",
  "Now the question the demo sets up. If S is fixed in size, and if the only thing that ever happens to it is addition, then what is in S is decided entirely by what you wrote into it. There is no other source. So here is the question. What happens when what you wrote does not cover what you ask?",
  "Back to the artifact, view two. Four steps, watch the badge and watch the grid. Step one: complexity three, examples that cover it, the model gets it right. Step two: I drag the slider to eight, the hardest setting, examples still cover it, and it is still right. So it can do hard problems. Step three: I turn coverage off. The examples drop back to easy ones. Same weights, same question, same model, and it fails. Step four: I turn coverage back on and it recovers, immediately, with no retraining and no new weights. Hundred percent to zero and back. Say the important part out loud. Same weights. Same question. Only the examples changed. Nothing about the model's ability moved in either direction.",
  "That was our four point two million parameter model. Fair question: is this a toy effect? Pathway's own model shows it at production scale. In their report, on ordering tasks of length eight, BDH-CQ scores zero out of twenty four without supporting examples, and twelve out of twenty four with them. Same model. Their ladder experiment shows exactly where the edge sits: perfect at lengths two through five, eighty point six percent at six, thirty three point three at seven, four point two at eight. That is the cliff, in their numbers, not ours. And the reason this matters commercially is on the bottom row: BDH-CQ costs about seven hundredths of a cent per task, against a dollar forty eight and a dollar seventy six for the two comparison systems. I want to be exact about one thing. We did not run BDH-CQ. There are no public weights. Everything in this table is published by Pathway and cited on the slide.",
  "So, to close. Capability was never the variable. S was. Three things to take home. One: more examples is not the fix. The right examples are. An extra ten easy examples buy you nothing at all. Two: this is not a small model quirk. We see it at four point two million parameters, Pathway see it at a hundred and fifty million. Three: the practical habit. When a model fails a hard case, before you reach for a bigger model or a fine tune, ask whether anything you showed it reached that far. The artifact is live at the link on screen, the code is public, and we are happy to take it apart in questions. Thank you."
]
